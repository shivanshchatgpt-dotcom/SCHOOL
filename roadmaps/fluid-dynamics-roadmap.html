<title>Fluid Dynamics Simulation — Roadmap</title>
<style>
  :root{
    --bg:#fafafa; --ink:#18181b; --mut:#71717a; --line:#e4e4e7;

  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;color:var(--ink);
    font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  /* top nav */
  .nav{position:sticky;top:0;height:52px;background:#fff;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;padding:0 18px;z-index:50}
  .nav .brand{font-weight:800;letter-spacing:-.02em}
  .nav .brand span{color:var(--rec)}
  .nav .title{color:var(--mut);font-size:14px}

  /* diagram flows with the page; wide trees scroll horizontally */
  .diagram-wrap{overflow-x:auto;background-color:var(--bg);
    background-image:radial-gradient(#d4d4d8 1.1px, transparent 1.1px);
    background-size:22px 22px;padding:26px 30px 70px}
  .canvas{position:relative;margin:0 auto}
  svg.wires{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
  .wire{fill:none;stroke:#a1a1aa;stroke-width:1.6;stroke-dasharray:5 5}

  .node{position:absolute;background:var(--yellow);border:1.6px solid var(--yellow-bd);
    border-radius:7px;padding:9px 12px;text-align:center;cursor:pointer;user-select:none;
    box-shadow:0 2px 0 rgba(0,0,0,.16);transition:box-shadow .1s,transform .1s}
  .node:hover{box-shadow:0 2px 0 rgba(0,0,0,.16),0 0 0 3px rgba(139,92,246,.25)}
  .node.main{background:var(--yellow-deep);font-weight:800;font-size:15px}
  .node .n-t{font-weight:600;font-size:13.5px;line-height:1.25}
  .node.main .n-t{font-weight:800}
  .node .n-s{font-size:11px;color:#3f3f46;margin-top:2px;font-weight:500;opacity:.85}
  .node .rec{position:absolute;top:-7px;left:-7px;width:12px;height:12px;border-radius:50%;
    background:var(--rec);border:2px solid #fff}
  .node .chk{position:absolute;top:-8px;right:-8px;width:18px;height:18px;border-radius:50%;
    background:#fff;border:1.6px solid var(--yellow-bd);display:flex;align-items:center;
    justify-content:center;font-size:11px;color:#fff;font-weight:800}
  .node.done .chk{background:var(--alt);border-color:var(--alt);color:#fff}
  .node.done .chk::after{content:"✓"}
  .callout{position:absolute;background:#fff;border:1.6px solid var(--yellow-bd);border-radius:8px;
    padding:11px 16px;text-align:center;font-size:13px;font-weight:600;box-shadow:0 2px 0 rgba(0,0,0,.12)}

    max-width:720px;margin:18px auto 0;box-shadow:0 4px 14px rgba(0,0,0,.05);
    display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px}
  .legend h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);width:100%}
  .legend .row{display:flex;align-items:center;gap:8px;font-size:13px;margin:0;color:#3f3f46}
  .legend .d{width:11px;height:11px;border-radius:50%}
  .legend .hint{font-size:11.5px;color:var(--mut);width:100%}

  .main{flex:1;min-width:0}
  .side{width:272px;flex:none;position:sticky;top:52px;height:calc(100vh - 52px);overflow:auto;

  body.no-side .side{display:none}
  .side .search{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:8px;outline:none}
  .side .search:focus{border-color:var(--rec)}
  .side h5{margin:14px 6px 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);display:flex;align-items:center;gap:6px}
  .side a.p-item,.side span.p-item{display:flex;align-items:center;justify-content:space-between;gap:8px;

  .side a.p-item:hover{background:#f4f4f5}
  .side .p-item.active{background:#fef9c3;color:#713f12;font-weight:600;border:1px solid #fde047}
  .side .p-item.soon{color:#b6b6bd;cursor:default}
  .side .p-item em{font-style:normal;font-size:9.5px;border:1px solid var(--line);border-radius:999px;padding:1px 6px;color:var(--mut);background:#fff}
  .side .p-item.active em{border-color:#fde047;background:#fffbeb;color:#92400e}
  .nav .spacer{flex:1}
  .nav .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:13px;cursor:pointer}
  .nav .btn:hover{background:#f4f4f5}

  body.embedded .nav{display:none}
  body.embedded .side{top:0;height:100vh}
  body.embedded .panel{top:0;height:100%}

  .panel{position:fixed;top:52px;right:0;height:calc(100% - 52px);width:min(420px,92vw);background:#fff;

  .panel .head{padding:16px 20px 14px;border-bottom:1px solid #f1f1f3;display:flex;justify-content:space-between;gap:12px}
  .panel h2{margin:0 0 6px;font-size:19px;line-height:1.25}
  .panel .sub{color:var(--mut);font-size:12.5px;margin-bottom:9px}
  .panel .close{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;width:30px;height:30px;cursor:pointer;flex:none}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11px;font-weight:600;border-radius:999px;padding:3px 9px;border:1px solid transparent}
  .chip.cat{background:#eef2ff;color:#3730a3;border-color:#c7d2fe}
  .chip.level{background:#ecfdf5;color:#065f46;border-color:#a7f3d0}
  .chip.time{background:#fffbeb;color:#92400e;border-color:#fde68a}
  .panel .body{padding:16px 20px 40px;overflow:auto}
  .sec{margin-bottom:18px}
  .sec h3{margin:0 0 8px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--rec)}
  .why{font-size:13.5px;color:#374151;line-height:1.55;margin:0}
  ul.li{margin:0;padding-left:18px} ul.li li{font-size:13px;color:#374151;margin:3px 0}
  ul.li.pr li::marker{color:var(--mut)}
  .can{background:#faf5ff;border:1px solid #e9d5ff;color:#5b21b6;border-radius:9px;padding:11px 13px;font-size:13px}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{background:#f4f4f5;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:#3f3f46}
  .res{display:flex;flex-direction:column;gap:6px}
  .res a{display:flex;align-items:center;gap:8px;font-size:13px;color:#2563eb;text-decoration:none;
    border:1px solid #e5e7eb;border-radius:8px;padding:8px 11px;background:#fafafa}
  .res a:hover{background:#f0f6ff;border-color:#bfdbfe}
  .res a span{color:var(--mut);margin-left:auto;font-size:11px}

/* ------------- layout ------------- */
const MAIN_W=196, MAIN_H=52, CH_W=182, CH_H=42, COL=290, YGAP=54, SECGAP=78;
const nodes=[]; // {title, x,y,w,h,kind,detail}
let y=0;
const sectionYs=[];
SECTIONS.forEach(sec=>{
  const k=Math.max(sec.left.length, sec.right.length, 1);
  const spread=(k-1)*YGAP;
  const secH=Math.max(MAIN_H, spread);
  const cy=y+secH/2;
  nodes.push({title:sec.main,x:-MAIN_W/2,y:cy-MAIN_H/2,w:MAIN_W,h:MAIN_H,kind:"main",rec:!!sec.rec});
  const place=(list,side,dx)=>{ list.forEach((t,i)=>{
    const cxX = side==="right" ? dx : -dx-CH_W;
    const cyy = cy - spread/2 + (i*YGAP) + (k-1-list.length)*0; // stack from top-ish
    const yy = cy - ((list.length-1)*YGAP)/2 + i*YGAP;
    nodes.push({title:t,x:cxX,y:yy-CH_H/2,w:CH_W,h:CH_H,kind:"child",side});
  });};
  place(sec.right,"right",COL);
  place(sec.left,"left",COL);
  y += secH + SECGAP;
  sectionYs.push({main:sec.main, end:y-SECGAP, callout:sec.callout});
});

/* bounds */
let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
nodes.forEach(n=>{minX=Math.min(minX,n.x);maxX=Math.max(maxX,n.x+n.w);minY=Math.min(minY,n.y);maxY=Math.max(maxY,n.y+n.h);});
const PAD=60, W=(maxX-minX)+PAD*2, H=(maxY-minY)+PAD*2;
const OX=-minX+PAD, OY=-minY+PAD;

const canvas=document.getElementById("canvas");
canvas.style.width=W+"px"; canvas.style.height=H+"px";
const svg=document.getElementById("wires");
svg.setAttribute("width",W); svg.setAttribute("height",H);

function elbow(x1,y1,x2,y2){
  const mx=(x1+x2)/2;
  return `M ${x1} ${y1} H ${mx} V ${y2} H ${x2}`;
}

/* draw nodes + wires */
const byTitle={};
nodes.forEach(n=>{ byTitle[n.title]=n; });
nodes.forEach(n=>{
  const d=document.createElement("div");
  d.className="node "+(n.kind==="main"?"main":"child");
  d.style.left=(n.x+OX)+"px"; d.style.top=(n.y+OY)+"px";
  d.style.width=n.w+"px";
  d.innerHTML='<div class="n-t">'+n.title+'</div>'+(DETAIL[n.title]&&DETAIL[n.title].sub?'<div class="n-s">'+DETAIL[n.title].sub+'</div>':'');
  if(n.rec) d.insertAdjacentHTML("afterbegin",'<span class="rec"></span>');
  d.insertAdjacentHTML("beforeend",'<span class="chk"></span>');
  canvas.appendChild(d);
  n._el=d;
  // wire from main to children
});
SECTIONS.forEach(sec=>{
  const m=byTitle[sec.main];
  [...sec.right].forEach(t=>{const c=byTitle[t]; if(c) addWire(m.x+m.w,m.y+m.h/2,c.x,c.y+c.h/2);});
  [...sec.left].forEach(t=>{const c=byTitle[t]; if(c) addWire(m.x,m.y+m.h/2,c.x+c.w,c.y+c.h/2);});
});
// vertical spine connectors between main nodes
for(let i=0;i<SECTIONS.length-1;i++){
  const a=byTitle[SECTIONS[i].main], b=byTitle[SECTIONS[i+1].main];
  addWire(a.x+a.w/2,a.y+a.h,b.x+b.w/2,b.y);
}
function addWire(x1,y1,x2,y2){
  const p=document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d",elbow(x1+OX,y1+OY,x2+OX,y2+OY));
  p.setAttribute("class","wire");
  svg.appendChild(p);
}
// callouts
sectionYs.forEach(s=>{ if(!s.callout) return; const sec=SECTIONS.find(x=>x.main===s.main); const k=Math.max(sec.left.length,sec.right.length,1);
  const co=document.createElement("div"); co.className="callout"; co.textContent=s.callout;
  const cw=380; co.style.width=cw+"px";
  const cnode=byTitle[s.main];
  co.style.left=(-cw/2+OX)+"px"; co.style.top=(s.end+OY+6)+"px";
  canvas.appendChild(co);
});

/* click + check + panel */
document.querySelectorAll(".node").forEach(el=>{
  const title=el.querySelector(".n-t").textContent;
  el.addEventListener("click",(e)=>{
    if(e.target.classList.contains("chk")){ el.classList.toggle("done"); return; }
    openPanel(title);
    document.querySelectorAll(".node").forEach(o=>o.style.outline="");
    el.style.outline="3px solid rgba(139,92,246,.5)";
  });
  if(localStorage.getItem("rm:"+title)==="1") el.classList.add("done");
  el.addEventListener("click",e=>{ if(e.target.classList.contains("chk")){ localStorage.setItem("rm:"+title, el.classList.contains("done")?"1":"0"); }});
});

function openPanel(title){
  const d=DETAIL[title]||{};
  document.getElementById("p-title").textContent=title;
  document.getElementById("p-sub").textContent=d.sub||"Topic";
  const chips=document.getElementById("p-chips"); chips.innerHTML="";
  [["cat",d.cat],["level",d.level],["time",d.time]].forEach(([k,v])=>{
    if(!v) return; const c=document.createElement("span"); c.className="chip "+k; c.textContent=v; chips.appendChild(c);
  });
  const b=document.getElementById("p-body"); b.innerHTML="";
  const sec=(h,node)=>{const s=document.createElement("div");s.className="sec";const t=document.createElement("h3");t.textContent=h;s.appendChild(t);s.appendChild(node);b.appendChild(s);};
  const list=(arr,cls)=>{const ul=document.createElement("ul");ul.className="li "+(cls||"");arr.forEach(x=>{const li=document.createElement("li");li.textContent=x;ul.appendChild(li);});return ul;};
  const pEl=document.createElement("p");
  if(d.why){pEl.className="why";pEl.textContent=d.why;sec("Overview",pEl.cloneNode(true));}
  if(d.prereq) sec("Prerequisites",list(d.prereq,"pr"));
  if(d.learn) sec("What you'll learn",list(d.learn));
  if(d.tools){const t=document.createElement("div");t.className="tags";d.tools.forEach(x=>{const sp=document.createElement("span");sp.className="tag";sp.textContent=x;t.appendChild(sp);});sec("Tools & technologies",t);}
  if(d.practice) sec("Hands-on practice",list(d.practice));
  if(d.resources){const r=document.createElement("div");r.className="res";d.resources.forEach(x=>{
    const a=document.createElement("a");a.href=x.u;a.target="_blank";a.rel="noopener";
    a.innerHTML=x.t+'<span>↗</span>';r.appendChild(a);});sec("Resources",r);}
  if(d.can){const c=document.createElement("div");c.className="can";c.textContent=d.can;sec("What you can do afterwards",c);}
  const p=document.getElementById("panel");p.classList.add("open");p.setAttribute("aria-hidden","false");
}
document.getElementById("p-close").addEventListener("click",()=>{
  const p=document.getElementById("panel");p.classList.remove("open");p.setAttribute("aria-hidden","true");});

{
