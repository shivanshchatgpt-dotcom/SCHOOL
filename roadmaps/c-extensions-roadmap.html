/* ------------- layout ------------- */
const MAIN_W=196, MAIN_H=52, CH_W=182, CH_H=42, COL=290, YGAP=54, SECGAP=78;
const nodes=[]; // {title, x,y,w,h,kind,detail}
let y=0;
const sectionYs=[];
SECTIONS.forEach(sec=>{
  const k=Math.max(sec.left.length, sec.right.length, 1);
  const spread=(k-1)*YGAP;
  const secH=Math.max(MAIN_H, spread);
  const cy=y+secH/2;
  nodes.push({title:sec.main,x:-MAIN_W/2,y:cy-MAIN_H/2,w:MAIN_W,h:MAIN_H,kind:"main",rec:!!sec.rec});
  const place=(list,side,dx)=>{ list.forEach((t,i)=>{
    const cxX = side==="right" ? dx : -dx-CH_W;
    const cyy = cy - spread/2 + (i*YGAP) + (k-1-list.length)*0; // stack from top-ish
    const yy = cy - ((list.length-1)*YGAP)/2 + i*YGAP;
    nodes.push({title:t,x:cxX,y:yy-CH_H/2,w:CH_W,h:CH_H,kind:"child",side});
  });};
  place(sec.right,"right",COL);
  place(sec.left,"left",COL);
  y += secH + SECGAP;
  sectionYs.push({main:sec.main, end:y-SECGAP, callout:sec.callout});
});

/* bounds */
let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
nodes.forEach(n=>{minX=Math.min(minX,n.x);maxX=Math.max(maxX,n.x+n.w);minY=Math.min(minY,n.y);maxY=Math.max(maxY,n.y+n.h);});
const PAD=60, W=(maxX-minX)+PAD*2, H=(maxY-minY)+PAD*2;
const OX=-minX+PAD, OY=-minY+PAD;

const canvas=document.getElementById("canvas");
canvas.style.width=W+"px"; canvas.style.height=H+"px";
const svg=document.getElementById("wires");
svg.setAttribute("width",W); svg.setAttribute("height",H);

function elbow(x1,y1,x2,y2){
  const mx=(x1+x2)/2;
  return `M ${x1} ${y1} H ${mx} V ${y2} H ${x2}`;
}

/* draw nodes + wires */
const byTitle={};
nodes.forEach(n=>{ byTitle[n.title]=n; });
nodes.forEach(n=>{
  const d=document.createElement("div");
  d.className="node "+(n.kind==="main"?"main":"child");
  d.style.left=(n.x+OX)+"px"; d.style.top=(n.y+OY)+"px";
  d.style.width=n.w+"px";
  d.innerHTML='<div class="n-t">'+n.title+'</div>'+(DETAIL[n.title]&&DETAIL[n.title].sub?'<div class="n-s">'+DETAIL[n.title].sub+'</div>':'');
  if(n.rec) d.insertAdjacentHTML("afterbegin",'<span class="rec"></span>');
  d.insertAdjacentHTML("beforeend",'<span class="chk"></span>');
  canvas.appendChild(d);
  n._el=d;
  // wire from main to children
});
SECTIONS.forEach(sec=>{
  const m=byTitle[sec.main];
  [...sec.right].forEach(t=>{const c=byTitle[t]; if(c) addWire(m.x+m.w,m.y+m.h/2,c.x,c.y+c.h/2);});
  [...sec.left].forEach(t=>{const c=byTitle[t]; if(c) addWire(m.x,m.y+m.h/2,c.x+c.w,c.y+c.h/2);});
});
// vertical spine connectors between main nodes
for(let i=0;i<SECTIONS.length-1;i++){
  const a=byTitle[SECTIONS[i].main], b=byTitle[SECTIONS[i+1].main];
  addWire(a.x+a.w/2,a.y+a.h,b.x+b.w/2,b.y);
}
function addWire(x1,y1,x2,y2){
  const p=document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d",elbow(x1+OX,y1+OY,x2+OX,y2+OY));
  p.setAttribute("class","wire");
  svg.appendChild(p);
}
// callouts
sectionYs.forEach(s=>{ if(!s.callout) return; const sec=SECTIONS.find(x=>x.main===s.main); const k=Math.max(sec.left.length,sec.right.length,1);
  const co=document.createElement("div"); co.className="callout"; co.textContent=s.callout;
  const cw=380; co.style.width=cw+"px";
  const cnode=byTitle[s.main];
  co.style.left=(-cw/2+OX)+"px"; co.style.top=(s.end+OY+6)+"px";
  canvas.appendChild(co);
});

/* click + check + panel */
document.querySelectorAll(".node").forEach(el=>{
  const title=el.querySelector(".n-t").textContent;
  el.addEventListener("click",(e)=>{
    if(e.target.classList.contains("chk")){ el.classList.toggle("done"); return; }
    openPanel(title);
    document.querySelectorAll(".node").forEach(o=>o.style.outline="");
    el.style.outline="3px solid rgba(139,92,246,.5)";
  });
  if(localStorage.getItem("rm:"+title)==="1") el.classList.add("done");
  el.addEventListener("click",e=>{ if(e.target.classList.contains("chk")){ localStorage.setItem("rm:"+title, el.classList.contains("done")?"1":"0"); }});
});

function openPanel(title){
  const d=DETAIL[title]||{};
  document.getElementById("p-title").textContent=title;
  document.getElementById("p-sub").textContent=d.sub||"Topic";
  const chips=document.getElementById("p-chips"); chips.innerHTML="";
  [["cat",d.cat],["level",d.level],["time",d.time]].forEach(([k,v])=>{
    if(!v) return; const c=document.createElement("span"); c.className="chip "+k; c.textContent=v; chips.appendChild(c);
  });
  const b=document.getElementById("p-body"); b.innerHTML="";
  const sec=(h,node)=>{const s=document.createElement("div");s.className="sec";const t=document.createElement("h3");t.textContent=h;s.appendChild(t);s.appendChild(node);b.appendChild(s);};
  const list=(arr,cls)=>{const ul=document.createElement("ul");ul.className="li "+(cls||"");arr.forEach(x=>{const li=document.createElement("li");li.textContent=x;ul.appendChild(li);});return ul;};
  const pEl=document.createElement("p");
  if(d.why){pEl.className="why";pEl.textContent=d.why;sec("Overview",pEl.cloneNode(true));}
  if(d.prereq) sec("Prerequisites",list(d.prereq,"pr"));
  if(d.learn) sec("What you'll learn",list(d.learn));
  if(d.tools){const t=document.createElement("div");t.className="tags";d.tools.forEach(x=>{const sp=document.createElement("span");sp.className="tag";sp.textContent=x;t.appendChild(sp);});sec("Tools & technologies",t);}
  if(d.practice) sec("Hands-on practice",list(d.practice));
  if(d.resources){const r=document.createElement("div");r.className="res";d.resources.forEach(x=>{
    const a=document.createElement("a");a.href=x.u;a.target="_blank";a.rel="noopener";
    a.innerHTML=x.t+'<span>↗</span>';r.appendChild(a);});sec("Resources",r);}
  if(d.can){const c=document.createElement("div");c.className="can";c.textContent=d.can;sec("What you can do afterwards",c);}
  const p=document.getElementById("panel");p.classList.add("open");p.setAttribute("aria-hidden","false");
}
document.getElementById("p-close").addEventListener("click",()=>{
  const p=document.getElementById("panel");p.classList.remove("open");p.setAttribute("aria-hidden","true");});

{
